name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify the ledger before publishing it
        run: python3 scripts/verify.py ledger/
      - name: Assemble the site
        run: |
          mkdir -p _site
          cp -r web/. _site/
          cp -r ledger _site/ledger
      - name: Write plain pages for readers that don't run scripts
        run: python3 scripts/build_static.py ledger/ _site/ --base https://priorledger.dev
      - name: List the pages that are new since the live site
        continue-on-error: true
        run: python3 scripts/indexnow.py plan ledger/ _site/ --base https://priorledger.dev --out indexnow-urls.txt
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Keep that list for after the deploy
        uses: actions/upload-artifact@v4
        with:
          name: indexnow-urls
          path: indexnow-urls.txt
          if-no-files-found: ignore
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
  announce:
    needs: deploy
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: indexnow-urls
      - name: Tell search engines about the new pages (IndexNow)
        run: python3 scripts/indexnow.py submit indexnow-urls.txt --base https://priorledger.dev --web web
