[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "priorledger"
version = "0.3.0"
description = "Append-only reasoning precedent for AI agents: MCP server, API and steward tools"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3,<3",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=43",
    "uvicorn>=0.30",
    "starlette>=0.40",
    "anyio>=4",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
priorledger-server = "priorledger.app:main"
priorledger-steward = "priorledger.steward:main"
priorledger-agent = "priorledger.agent:main"

[tool.setuptools]
packages = ["priorledger", "priorledger.admin"]

[tool.setuptools.package-data]
"priorledger.admin" = ["*.html", "*.css", "*.js"]
