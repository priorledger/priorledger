# The public face of the Prior Ledger service: an allow-list, nothing more.
#
# It listens on the machine itself only (127.0.0.1:8480). Nothing on the
# public address answers for Prior Ledger: requests arrive through a
# Cloudflare Tunnel (cloudflared, an outbound connection), so the machine's
# address never appears in DNS and no inbound port is opened for it.
# TLS is terminated at Cloudflare; the tunnel itself is encrypted.
#
# Public:      MCP (/mcp), the read API, proposals, discovery files.
# Never public: /admin and /api/steward (the steward portal). They get 404 here,
#              and the service refuses them on this host name a second time
#              (PRIORLEDGER_ADMIN_HOSTS).
# The website is served by GitHub Pages; this host only redirects there.

limit_req_zone $binary_remote_addr zone=pl_mcp:10m rate=60r/m;
limit_req_zone $binary_remote_addr zone=pl_read:10m rate=120r/m;
limit_req_zone $binary_remote_addr zone=pl_write:10m rate=6r/m;
limit_req_status 429;

# Any other host name on this port: close the connection.
server {
    listen 127.0.0.1:8480 default_server;
    return 444;
}

server {
    listen 127.0.0.1:8480;
    server_name api.priorledger.dev;

    # The only client of this port is cloudflared on the same machine, which
    # passes the visitor's address in CF-Connecting-IP. Take it as the client
    # address, so rate limits apply per visitor and not to the tunnel as a whole.
    set_real_ip_from 127.0.0.1;
    real_ip_header CF-Connecting-IP;

    server_tokens off;
    access_log off;                       # a commons keeps no log of who read what
    client_max_body_size 128k;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

    # Shared proxy settings. X-Forwarded-For is overwritten, never appended,
    # so a client cannot forge the address the service rate-limits on.
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_read_timeout 60s;

    # MCP (streamable HTTP, stateless)
    location = /mcp {
        limit_except GET POST DELETE { deny all; }
        limit_req zone=pl_mcp burst=30 nodelay;
        proxy_buffering off;
        proxy_pass http://127.0.0.1:8400;
    }

    # Read API
    location = /api/head {
        limit_except GET { deny all; }
        limit_req zone=pl_read burst=60 nodelay;
        proxy_pass http://127.0.0.1:8400;
    }
    location ^~ /api/entries {
        limit_except GET { deny all; }
        limit_req zone=pl_read burst=60 nodelay;
        proxy_pass http://127.0.0.1:8400;
    }
    location ^~ /api/subjects/ {
        limit_except GET { deny all; }
        limit_req zone=pl_read burst=60 nodelay;
        proxy_pass http://127.0.0.1:8400;
    }
    location = /api/usage {
        limit_except GET { deny all; }
        limit_req zone=pl_read burst=60 nodelay;
        proxy_pass http://127.0.0.1:8400;
    }

    # Proposals: submit, and check status
    location = /api/proposals {
        limit_except POST { deny all; }
        limit_req zone=pl_write burst=3 nodelay;
        proxy_pass http://127.0.0.1:8400;
    }
    location ~ ^/api/proposals/[0-9]+$ {
        limit_except GET { deny all; }
        limit_req zone=pl_read burst=60 nodelay;
        proxy_pass http://127.0.0.1:8400;
    }

    # Discovery
    location = /.well-known/priorledger.json { proxy_pass http://127.0.0.1:8400; }
    location = /llms.txt                     { proxy_pass http://127.0.0.1:8400; }
    location = /healthz                      { proxy_pass http://127.0.0.1:8400; }

    # The website lives on GitHub Pages
    location = / { return 302 https://priorledger.dev/; }

    # Everything else, including /admin and /api/steward: not here.
    location / { return 404; }
}
